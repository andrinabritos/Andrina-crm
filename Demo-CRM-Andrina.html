</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status" aria-live="polite"></div><script>window.CRM_DEMO=true;</script><script>'use strict';
const DEMO=window.CRM_DEMO===true,STORE='andrina-crm-demo-v1';
const STATUS=['Pendiente','En curso','En revisión','Bloqueada','Completada'],STAGES=['Idea','Guion','Producción','Diseño / Edición','Revisión interna','Cliente','Correcciones','Aprobado','Programado','Publicado'];

const id=()=>crypto.randomUUID(),today=()=>localDate(new Date());
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayOffset(n){let d=new Date();d.setDate(d.getDate()+n);return localDate(d)}
function pretty(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'Sin fecha'}
function stamp(d){return new Date(d).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function initials(n){return String(n||'?').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase()}
function avatar(n,url=''){return `<span class="avatar">${url?`<img src="${esc(url)}" alt="${esc(n)}">`:esc(initials(n))}</span>`}
function client(id){return state.clients.find(c=>c.id===id)||{name:'Cliente'}}
function owner(id){return state.users.find(u=>u.id===id)||{name:'Responsable'}}
const done=t=>t.status==='Completada',admin=()=>state.user.role==='admin';
function badge(v){return `<span class="badge ${['Crítico','Bloqueada'].includes(v)?'red':['Prioritario','Correcciones'].includes(v)?'orange':['En revisión','Cliente','Contenido'].includes(v)?'purple':['Planificable','Completada'].includes(v)?'gray':''}">${esc(v)}</span>`}
function opts(list,selected){return list.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function entityOpts(list,selected){return list.map(v=>`<option value="${esc(v.id)}" ${v.id===selected?'selected':''}>${esc(v.name)}</option>`).join('')}
function notify(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').style.display='none',5500)}
function seed(){
 const users=[{id:'a',name:'Andrina',email:'andri@ejemplo.com',role:'admin',active:1},{id:'b',name:'Sofía · ejemplo',email:'sofi@ejemplo.com',role:'team',active:1},{id:'c',name:'Martina · ejemplo',email:'marti@ejemplo.com',role:'team',active:1}];
 const clients=[{id:'che',name:'Chetech',plan:'Ejemplo · Gestión de redes',memory:'Ejemplo editable. Diagnóstico sin cargo. Retiro a domicilio en Río Tercero.',contact:'',startDate:today(),notes:''},{id:'paj',name:'Pajtman',plan:'Ejemplo · Contenido mensual',memory:'Ejemplo editable. Mantener tono claro y cercano. Revisión profesional antes de publicar.',contact:'',startDate:today(),notes:''},{id:'bil',name:'Expreso Biletta',plan:'Ejemplo · Redes y contenido',memory:'Ejemplo editable. Kilómetros de confianza. Cercanía, equipo y logística.',contact:'',startDate:today(),notes:''},{id:'up',name:'Up! Mini Eventos',plan:'Ejemplo · Gestión de redes',memory:'Ejemplo editable. Espacio para eventos infantiles, zona Montessori y cocina propia.',contact:'',startDate:today(),notes:''}];
 const titles=['Editar reel del taller','Diseñar carrusel educativo','Preparar copy para LinkedIn','Planificar grabación del salón','Revisar guion de servicio técnico','Armar propuesta de contenido'];
 const tasks=titles.map((title,i)=>({id:'t'+i,title,clientId:clients[i%4].id,assigneeId:users[i%3].id,kind:i===5?'Tarea':'Contenido',status:STATUS[i%5],stage:['Diseño / Edición','Guion','Revisión interna','Producción','Aprobado','Idea'][i],priority:i===0?'Prioritario':'Planificable',priorityReason:i===0?'Ejemplo: fecha de campaña acordada.':'',due:dayOffset(i-1),publishDate:dayOffset(i+2),description:'Dato de demostración. Reemplazá este brief por el trabajo real.',script:'',copy:'',format:i%2?'Carrusel':'Reel',platform:'Instagram',blocker:i===3?'Ejemplo: faltan imágenes del cliente.':'',links:[],rounds:0,roundLimit:2,version:1}));
 return {user:users[0],users,clients,tasks,comments:[],activity:[],settings:{name:'Andrina Studio',accent:'#d9f36a',secondary:'#c8b8f2',avatar:''},csrf:'demo'};
}
let fullDemo;
function demoState(){const s=structuredClone(fullDemo),u=s.users.find(x=>x.id===fullDemo.currentUser)||s.users[0];s.user=u;if(u.role!=='admin'){s.tasks=s.tasks.filter(t=>t.assigneeId===u.id);s.clients=s.clients.filter(c=>s.tasks.some(t=>t.clientId===c.id));s.clients=s.clients.map(c=>({id:c.id,name:c.name,plan:c.plan,memory:c.memory}));s.users=s.users.filter(x=>x.id===u.id);s.comments=s.comments.filter(c=>s.tasks.some(t=>t.id===c.task_id));s.activity=s.activity.filter(c=>s.tasks.some(t=>t.id===c.task_id))}return s}
function saveDemo(){try{localStorage.setItem(STORE,JSON.stringify(fullDemo))}catch{notify('Este navegador no permite guardar la demo. Los cambios durarán solo esta sesión.')}state=demoState()}
async function api(path,method='GET',body){
 if(DEMO){
  if(path==='/api/state')return demoState();
  if(path==='/api/export')return fullDemo;
  const parts=path.split('/'),key=parts[2],itemid=parts[3];
  if(key==='comments'){fullDemo.comments.push({id:id(),task_id:body.taskId,user_id:state.user.id,text:body.text,created:new Date().toISOString(),author:state.user.name})}
  else if(key==='settings'){fullDemo.settings=body}
  else if(key==='users'){if(method==='POST')fullDemo.users.push({id:id(),name:body.name,email:body.email,role:'team',active:1});else {const clean={...body};delete clean.password;Object.assign(fullDemo.users.find(u=>u.id===itemid),clean);}}
  else if(['tasks','clients'].includes(key)){
   let arr=fullDemo[key];if(method==='DELETE')fullDemo[key]=arr.filter(x=>x.id!==itemid);else if(method==='POST'){let item={...body,id:id(),version:1};arr.push(item);if(key==='tasks')demoLog(item,'Creó la tarea')}
   else {let idx=arr.findIndex(x=>x.id===itemid);if(key==='tasks'&&arr[idx].version!==body.version)throw Error('Otra pestaña modificó la tarea. Recargá.');arr[idx]={...body,id:itemid,version:(arr[idx].version||0)+1};if(key==='tasks')demoLog(arr[idx],'Actualizó la tarea')}
  }
  saveDemo();return {ok:true};
 }
 let r=await fetch(path,{method,credentials:'same-origin',headers:method==='GET'?{}:{'Content-Type':'application/json','X-CSRF-Token':state?.csrf||''},body:body?JSON.stringify(body):undefined});
 const d=await r.json();if(!r.ok){if(r.status===401&&path!=='/api/login'){clearInterval(poll);state=null;login()}throw Error(d.error||'No pudimos completar la acción.')}return d;
}
function demoLog(t,text){fullDemo.activity.unshift({id:id(),task_id:t.id,author:state.user.name,text,created:new Date().toISOString()})}
async function refresh(render=true){state=await api('/api/state');if(render)draw()}
function login(){
 $('#app').innerHTML=`<div class="login"><div class="login-art"><div class="brand"><span class="symbol">✳</span> Andrina Studio</div><div><span class="eyebrow">Tu espacio de operaciones</span><h1>Más claridad.<br>Más espacio<br>para crear.</h1><p>Clientes, contenido y equipo.<br>Todo en el mismo lugar.</p></div><small>Un estudio organizado empieza acá.</small></div><div class="login-form"><h2>Qué bueno verte.</h2><p class="muted">Ingresá con tu cuenta del equipo.</p><form id="login-form"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required><p class="err" id="login-error" role="alert"></p><button class="btn lime">Entrar a operaciones →</button></form><p class="notice">El acceso de clientes se habilitará en una próxima etapa.</p></div></div>`;
 $('#login-form').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{await api('/api/login','POST',Object.fromEntries(new FormData(e.target)));await refresh();startPoll()}catch(err){$('#login-error').textContent=err.message}finally{btn.disabled=false}};
}
const navItems=[['dashboard','◈','Resumen'],['tasks','☷','Tareas'],['mine','◉','Mi trabajo'],['content','▧','Contenido'],['calendar','▦','Calendario'],['clients','◇','Clientes'],['team','♧','Equipo'],['portal','↗','Portal de clientes'],['settings','⚙','Configuración']];
function draw(){

 const open=state.tasks.filter(t=>!done(t)),late=open.filter(t=>t.due&&t.due<today()),review=open.filter(t=>t.status==='En revisión'),block=open.filter(t=>t.status==='Bloqueada');

tate.tasks.filter(t=>t.assigneeId===u.id),complete=ts.filter(done).length;return `<div style="margin-bottom:14px"><div class="person">${avatar(u.name)}<div><strong style="font-size:12px">${esc(u.name)}</strong><div class="load">${ts.length-complete} abiertas · ${complete} terminadas</div></div></div><div class="progress"><span style="width:${ts.length?complete/ts.length*100:0}%"></span></div></div>`}).join('')}</div></div></div></div>`;

ideo, diseño)','links',t.links.join('\n'))}</div><p class="muted" style="margin-top:15px">Se guardan enlaces, no archivos subidos. ${taskid?'Versión '+t.version:'Nueva tarea'}.</p><div class="actions">${taskid&&admin()?'<button type="button" class="btn danger" data-action="delete-task">Eliminar</button>':''}<button class="btn lime">Guardar tarea</button></div></form>`;
 else if(detailTab==='marca')body=`<h3 style="margin-top:20px">${esc(client(t.clientId).name)} · memoria de marca</h3><p class="prewrap" style="margin:20px 0">${esc(client(t.clientId).memory||'Sin memoria registrada todavía.')}</p><p class="muted">${esc(client(t.clientId).plan)}</p>`;

 else body=state.activity.filter(c=>c.task_id===taskid).map(c=>`<div class="comment"><strong>${esc(c.text)}</strong><p>${esc(c.author)} · ${stamp(c.created)}</p></div>`).join('')||'<p class="empty">Sin actividad registrada.</p>';

async function runAction(action){

 if(action==='logout'){if(DEMO){notify('La demo no tiene sesiones reales.');return}await api('/api/logout','POST',{});state=null;clearInterval(poll);login();return}
 if(action==='reset-demo'){if(confirm('¿Restablecer los ejemplos? Se borrarán los cambios de esta demo.')){fullDemo=seed();saveDemo();draw()}return}
 if(action==='delete-task'){if(confirm('¿Eliminar esta tarea y sus comentarios?')){let t=state.tasks.find(t=>t.id===focusId);await api('/api/tasks/'+t.id,'DELETE',{version:t.version});close();await refresh();notify('Tarea eliminada.')}return}

}

 if(b.dataset.display){display=b.dataset.display;$('#surface').innerHTML=surface();return}
 if(b.dataset.detail){detailTab=b.dataset.detail;taskModal(focusId);return}
 if(b.dataset.cal){cal=Number(b.dataset.cal)===0?new Date():new Date(cal.getFullYear(),cal.getMonth()+Number(b.dataset.cal),1);$('#surface').innerHTML=surface();return}
 if(b.dataset.stat){view=b.dataset.stat==='clients'?'clients':'tasks';resetFilters();statusFilter=b.dataset.stat==='review'?'En revisión':b.dataset.stat==='late'?'__late':'';display=b.dataset.stat==='late'?'list':display;draw();return}
 if(b.dataset.password){userModal(b.dataset.password);return}
 if(b.dataset.userToggle){let u=state.users.find(u=>u.id===b.dataset.userToggle);if(confirm(`${u.active?'Desactivar':'Activar'} el acceso de ${u.name}?`)){await api('/api/users/'+u.id,'PATCH',{active:!u.active});await refresh()}return}
 }catch(err){notify(err.message)}
});
document.addEventListener('keydown',e=>{if(e.target.matches('tr[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();detailTab='ficha';taskModal(e.target.dataset.task)}});
document.addEventListener('change',e=>{if(e.target.id==='client-filter')clientFilter=e.target.value;else if(e.target.id==='owner-filter')ownerFilter=e.target.value;else if(e.target.id==='status-filter')statusFilter=e.target.value;else return;$('#surface').innerHTML=surface()});
document.addEventListener('submit',async e=>{if(e.target.id!=='settings-form')return;e.preventDefault();await saving(e.target,()=>api('/api/settings','PATCH',Object.fromEntries(new FormData(e.target))),()=>{refresh();notify('Configuración actualizada.')})});
$('#modal').addEventListener('cancel',()=>{focusId=null});
function startPoll(){clearInterval(poll);poll=setInterval(()=>{if(!document.hidden&&!$('#modal').open&&state&&!['settings','clients','team'].includes(view))refresh().catch(()=>{});},30000)}
async function boot(){if(DEMO){try{fullDemo=JSON.parse(localStorage.getItem(STORE))||seed()}catch{fullDemo=seed()}state=demoState();draw();window.addEventListener('storage',e=>{if(e.key===STORE){try{fullDemo=JSON.parse(e.newValue)||seed();state=demoState();if(!$('#modal').open)draw()}catch{}}});return}try{await refresh();startPoll()}catch{login()}}
boot();
</script></body></html>
