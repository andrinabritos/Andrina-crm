<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Promo Taste</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#s{width:1080px;height:1920px;position:relative;background:url(original.png) 0 0/1080px 1920px;font-family:Montserrat,sans-serif}
.box{position:absolute;left:50%;top:722px;transform:translateX(-50%);background:#EBFE57;color:#151515;padding:18px 54px 22px;text-align:center;white-space:nowrap}
.antes{font-size:44px;font-weight:700;color:#3b3b3b;letter-spacing:.01em}
.antes s{text-decoration:none;position:relative;font-weight:800}
.antes s::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:6px;background:#d62828;transform:rotate(-6deg);border-radius:3px}
.ahora{display:flex;align-items:baseline;justify-content:center;gap:20px;margin-top:2px}
.ahora small{font-size:44px;font-weight:800}
.ahora b{font-size:104px;font-weight:900;letter-spacing:-.02em;line-height:1}
</style></head><body>
<div id="s"><div class="box"><div class="antes">ANTES <s>$48.800</s></div><div class="ahora"><small>AHORA</small><b>$30.000</b></div></div></div>
</body></html>
